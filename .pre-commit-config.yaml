exclude: (\.pio|lib/NimBLE-Arduino|lib/ArduinoCompat)/.*
repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.1.9
    hooks:
      - id: insert-license
        files: \.(h\+\+|h|hh|hxx|hpp|cuh|c|cc|cpp|cu|c\+\+|cxx|tpp|txx)$
        args:
          - --license-filepath
          - license_header.txt
          - --comment-style
          - /*| *| */
  # Firmware and app agree on calibration state numbers only by convention. A state can be
  # defined, entered and handled while getCalibrationState() never returns it, which is exactly
  # how the manual calibration flow shipped reporting "idle". Catch that here.
  - repo: local
    hooks:
      - id: calibration-states-reachable
        name: calibration states are reachable
        entry: python3 tools/check_calibration_states.py
        language: system
        pass_filenames: false
        files: ^(include/Main\.h|src/Main\.cpp)$
