name: build

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-platformio-
      - name: Ensure changelog is updated
        uses: dangoslen/changelog-enforcer@v3.6.1
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
      - name: Get current date
        id: date
        run: echo "date=$(date +'%y.%-m.%-d')" >> $GITHUB_OUTPUT
      - name: Test with environment variables
        run: echo $TAG_NAME - $RELEASE_NAME
        env:
          TAG_NAME: ${{ steps.date.outputs.date }}
          RELEASE_NAME: ${{ steps.date.outputs.date }}- 
      - uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.date.outputs.date }}
          message: "Automatic release ${{ steps.date.outputs.date }}"
          tag_exists_error: false
      - name: Get build version
        id: build_version
        run: |
          git fetch --tags --quiet
          echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            software:
              - '!(Hardware/**)'
            hardware:
              - 'Hardware/**'
      - name: Show python version
        run: python --version
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Pre-install PlatformIO packages (release env)
        run: platformio pkg install -e release
      - name: Check pre-commit hooks
        uses: pre-commit/action@v3.0.1
      - name: Build firmware
        run: platformio run -e release
      - name: Build filesystem
        run: platformio run -e release --target buildfs
      - name: Create artifacts
        run: |
          7z a SmartSpin2kFirmware-${{ steps.build_version.outputs.version }}.bin.zip ./.pio/build/release/*.bin
      - name: Archive
        uses: actions/upload-artifact@v5
        with:
          name: all-artifacts
          path: SmartSpin2kFirmware-${{ steps.build_version.outputs.version }}.bin.zip
      - name: Download Artifacts
        uses: actions/download-artifact@v6
        with:
          name: all-artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.build_version.outputs.version }}
          name: SmartSpin2k ${{ steps.build_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: ${{ github.event.head_commit.message }}
          files: |
            SmartSpin2kFirmware-${{ steps.build_version.outputs.version }}.bin.zip
              update-changelog:
      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@v3
        with:
          version: ${{ steps.build_version.outputs.version }}


      
